# Fork release (Windows only)
#
# Builds the fork's Windows installer with the fork's config layer
# (frontend/src-tauri/tauri.fork.conf.json), signs it for the Tauri updater with the
# fork's own minisign key, and creates a DRAFT GitHub release with latest.json.
# Nothing reaches installed apps until the draft is published by hand.
# Procedure and key handling: see FORK.md.

name: "Fork Release (Windows)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  FORK_CONFIG: frontend/src-tauri/tauri.fork.conf.json
  RELEASE_BRANCH: custom

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Refuse to run outside the release branch
        if: github.ref != format('refs/heads/{0}', env.RELEASE_BRANCH)
        run: |
          echo "::error::Run this workflow from the '${RELEASE_BRANCH}' branch (got ${GITHUB_REF})."
          exit 1

      - name: Check updater signing secrets are set
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$SIGNING_KEY" ]; then echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set"; missing=1; fi
          if [ -z "$SIGNING_KEY_PASSWORD" ]; then echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set"; missing=1; fi
          # The key file is one base64 line that decodes to a minisign "untrusted comment: ... secret key" header
          # (this also rejects the .pub file pasted by mistake).
          if [ -n "$SIGNING_KEY" ] && ! printf '%s' "$SIGNING_KEY" | tr -d '\r\n ' | base64 -d 2>/dev/null | head -1 | grep -q '^untrusted comment:.*secret key'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not the content of the .key file (see FORK.md)"; missing=1
          fi
          exit $missing

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and check version
        id: get-version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$FORK_CONFIG")
          # Format required by the fork: <upstream x.y.z>-<fork build number>, numeric only (NSIS/semver safe).
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' in $FORK_CONFIG must look like 0.5.0-1"
            exit 1
          fi
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::Tag v${VERSION} already exists; bump the version in $FORK_CONFIG."
            exit 1
          fi
          UPSTREAM=$(python3 -c 'import json; print(json.load(open("frontend/src-tauri/tauri.conf.json"))["version"])')
          if [[ "${VERSION%-*}" != "$UPSTREAM" ]]; then
            echo "::warning::Fork version $VERSION is not based on upstream version $UPSTREAM (tauri.conf.json)."
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        with:
          script: |
            const version = process.env.VERSION;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              target_commitish: context.sha,
              name: `Meetily (fork) v${version}`,
              body: `Fork build v${version} from \`${context.sha.substring(0, 7)}\` on \`${process.env.GITHUB_REF_NAME}\`.`,
              draft: true,
              prerelease: false,
            });
            core.info(`Created draft release ${data.id}`);
            return data.id;

  build-windows:
    needs: create-release
    permissions:
      contents: write
    # Reuse upstream's build so its build fixes keep applying to the fork.
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      # Path is relative to frontend/ (tauri-action projectPath).
      build-args: --config src-tauri/tauri.fork.conf.json
      sign-binaries: false
      asset-prefix: meetily
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  publish-manifest:
    needs: [create-release, build-windows]
    # minisign is only packaged for Ubuntu 23.04+
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify installer signature and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          mkdir release-assets
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              --header "Accept: application/octet-stream" > "release-assets/$(basename -- "$asset_name")"
          done
          ls -la release-assets
          python3 - <<'PYCODE'
          import base64, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          root = Path('release-assets')
          version = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']

          # Public key comes from the fork config: a build signed with any other key fails here.
          pubkey = json.load(open(os.environ['FORK_CONFIG']))['plugins']['updater']['pubkey']
          (root / 'public.key').write_bytes(base64.b64decode(pubkey, validate=True))

          # The version in the file name proves the fork config layer was applied to the build.
          matches = list(root.glob(f'*_{version}_x64-setup.exe'))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one NSIS installer for {version}, found {[m.name for m in matches]}')
          installer = matches[0]
          sig_path = Path(str(installer) + '.sig')
          signature = sig_path.read_text().strip()
          (root / 'installer.minisig').write_bytes(base64.b64decode(signature, validate=True))
          subprocess.run(['minisign', '-Vm', str(installer), '-p', str(root / 'public.key'),
                          '-x', str(root / 'installer.minisig')], check=True)

          entry = {
              'url': f'https://github.com/{repo}/releases/download/v{version}/{quote(installer.name)}',
              'signature': signature,
          }
          manifest = {
              'version': version,
              'notes': '',
              'pub_date': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'platforms': {'windows-x86_64': entry, 'windows-x86_64-nsis': entry},
          }
          (root / 'latest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print((root / 'latest.json').read_text())
          PYCODE
          upload_url=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.upload_url | split("{")[0]')
          gh api --method POST "$upload_url?name=latest.json" --header "Content-Type: application/json" \
            --input release-assets/latest.json
          {
            echo "## Draft release v${VERSION} ready"
            echo ""
            echo "Installer signature verified with the fork key. Test the installer, then publish:"
            echo "https://github.com/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
